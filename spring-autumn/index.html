<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:image/base64;," />
    <meta
      name="viewport"
      content="height=device-height, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no,viewport-fit=cover"
    />
    <title>Spring-Autumn</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app" class="main">
      <div class="title flex center">
        <div class="flex center btn-group">
          <div id="pre-month" class="btn">
            <span class="left">&lt;</span>
          </div>
          <div id="pre-year" class="btn">
            <span class="left">&lt;&lt;</span>
          </div>
        </div>
        <div id="curr-month" class="canlendar-yd">1845-04</div>
        <div class="flex center btn-group">
          <div id="next-year" class="btn"><span>&gt;&gt;</span></div>
          <div id="next-month" class="btn"><span>&gt;</span></div>
        </div>
      </div>
      <div id="month-content" class="month-content">
        <div>
          <div class="week flex center">
            <div>一</div>
            <div>二</div>
            <div>三</div>
            <div>四</div>
            <div>五</div>
            <div>六</div>
            <div>日</div>
          </div>
          <div id="month-days" class="month-days flex center"></div>
        </div>
      </div>
      <div class="today-content">
        <div>
          <div id="today-date">1845-04</div>
          <div id="today-lunar-date">乙巳年二月廿五</div>
          <div id="today-solar-term"></div>
          <div id="today-festival"></div>
        </div>
        <div class="checkd-day">
          <div id="curr-date"></div>
          <div id="curr-lunar-date"></div>
          <div id="curr-solar-term"></div>
          <div id="curr-festival"></div>
        </div>
      </div>
    </div>
  </body>
  <script src="./script.js"></script>
</html>
