<!doctype html>
<html>
  <head>
    <title>Handful of Pages</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="height=device-height, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no,viewport-fit=cover"
    />
    <link rel="icon" href="data:image/png;base64," />
    <style>
      :root {
        color-scheme: dark light;
        max-width: 70ch;
        padding: 3em 1em;
        margin: auto;
        line-height: 1.75;
        font-family: monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background-color: #1c1b22;
          --text-color: #fbfbfe;
          --link-color: oklch(83% 0.11 205);
        }
      }

      @media (prefers-color-scheme: light) {
        :root {
          --background-color: #fff;
          --text-color: #15141a;
          --link-color: oklch(55% 0.24 260);
        }
      }

      body {
        background-color: var(--background-color);
        color: var(--text-color);
        font-size: 1rem;
      }

      a {
        color: var(--link-color);
        font-size: 1.3rem;
      }

      a + span {
        font-size: 0.8rem;
        margin-left: 0.5rem;
      }

      h1 {
        font-size: 1.6rem;
        font-weight: 500;
      }

      li {
        line-height: 2;
      }
    </style>
  </head>
  <body>
    <h1>Handful of Pages</h1>
    <p>
      <em>
        This is a list of tiny, self-contained web apps.
        <br />
        All are small and fuss-free.
        <br />
        And a few are missing.
      </em>
    </p>
    <ul>
      <li><a href="./spring-autumn">spring-autumn</a><span>Calendar</span></li>
      <li><a href="./ying-xu">ying-xu</a><span>Resonance breathing</span></li>
    </ul>
  </body>
</html>
